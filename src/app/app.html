<header class="border-b border-stone-800 bg-stone-950">
  <nav class="mx-auto flex max-w-6xl items-center gap-6 px-4 py-3">
    <a routerLink="/" class="font-serif text-xl text-amber-300">⚔ Warhammer JDR</a>
    @if (auth.user(); as user) {
      <a routerLink="/" routerLinkActive="text-amber-300" [routerLinkActiveOptions]="{ exact: true }" class="hover:text-amber-300">Groupe</a>
      <a routerLink="/journal" routerLinkActive="text-amber-300" class="hover:text-amber-300">Journal</a>
      <span class="ml-auto text-sm text-stone-400">
        {{ user.displayName }}
        @if (auth.isGm()) { <span class="ml-1 rounded bg-red-900 px-1.5 py-0.5 text-xs text-red-100">MJ</span> }
      </span>
      <button type="button" (click)="logout()" class="text-sm text-amber-400 hover:underline">Changer</button>
    }
  </nav>
</header>

<main class="mx-auto max-w-6xl px-4 py-8">
  <router-outlet />
</main>
