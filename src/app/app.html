<mat-sidenav-container class="h-dvh">
  <mat-sidenav
    #drawer
    class="w-64"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!!auth.user() && !isHandset()"
    [fixedInViewport]="true"
  >
    <div class="flex h-16 items-center gap-2 px-4">
      <mat-icon class="text-primary">swords</mat-icon>
      <span class="font-display text-lg font-semibold text-primary">Warhammer JDR</span>
    </div>
    <mat-nav-list>
      @for (link of navLinks; track link.path) {
        <a
          mat-list-item
          [routerLink]="link.path"
          routerLinkActive
          #rla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          [activated]="rla.isActive"
          (click)="closeIfHandset(drawer)"
        >
          <mat-icon matListItemIcon>{{ link.icon }}</mat-icon>
          <span matListItemTitle>{{ link.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="sticky top-0 z-20 gap-2 border-b border-outline-variant">
      @if (auth.user() && isHandset()) {
        <button mat-icon-button type="button" aria-label="Ouvrir le menu" (click)="drawer.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
      }
      @if (!auth.user() || isHandset()) {
        <a routerLink="/" class="flex items-center gap-2 font-display text-lg font-semibold text-primary">
          <mat-icon>swords</mat-icon>
          <span class="hidden sm:inline">Warhammer JDR</span>
        </a>
      }

      <span class="flex-1"></span>

      <button
        mat-icon-button
        type="button"
        class="theme-toggle"
        [attr.aria-label]="theme.isDark() ? 'Passer au thème clair' : 'Passer au thème sombre'"
        [matTooltip]="theme.isDark() ? 'Thème clair' : 'Thème sombre'"
        (click)="theme.toggle()"
      >
        <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      @if (auth.user(); as user) {
        <button mat-button type="button" [matMenuTriggerFor]="userMenu" class="!h-11">
          <span class="flex items-center gap-2">
            <span class="avatar h-8 w-8 text-sm">{{ initial() }}</span>
            <span class="hidden text-on-surface sm:inline">{{ user.displayName }}</span>
            @if (auth.isGm()) {
              <span class="rounded-full bg-tertiary-container px-2 py-0.5 text-xs font-semibold text-on-tertiary-container">MJ</span>
            }
          </span>
        </button>
        <mat-menu #userMenu="matMenu" xPosition="before">
          <div class="px-4 py-2 sm:hidden">
            <div class="font-semibold">{{ user.displayName }}</div>
            <div class="muted">{{ auth.isGm() ? 'Maître du Jeu' : 'Joueur' }}</div>
          </div>
          <button mat-menu-item type="button" (click)="logout()">
            <mat-icon>switch_account</mat-icon>
            <span>Changer de profil</span>
          </button>
        </mat-menu>
      }
    </mat-toolbar>

    <main class="mx-auto max-w-6xl px-4 py-6 sm:px-6 sm:py-8">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
